name: Update Open Source Contributions
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  copilot-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Fetch contributions
        run: node scripts/fetch-contributions.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Install Copilot CLI
        run: npm install -g @github/copilot
      - name: Generate descriptions
        id: ai
        uses: actions/ai-inference@v3
        with:
          prompt-file: ./temp/ai-input.txt
          model: gpt-5-mini
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Apply descriptions
        run: node scripts/apply-descriptions.mjs "${{ steps.ai.outputs.response }}"
      - name: Commit and push
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          git diff --quiet && exit 0
          git add -A
          git commit -m "chore: update open source contributions [skip ci]"
          git push
